[package]
name = "lcos"
version = "1.6.0"
description = "Logiciel de caisse open source"
authors = ["vitiluxx"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.77"
# Deux binaires dans le paquet : la caisse, et l outil de licences de l
# editeur. Celui-ci designe lequel est "le" programme pour cargo et pour le
# bundle, sinon l empaquetage ne sait pas quoi installer.
default-run = "lcos"

[lib]
name = "lcos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
sha2 = "0.10"
hmac = "0.12"
getrandom = "0.2"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "rand_core"] }
rand_core = { version = "0.6", default-features = false, features = ["getrandom"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
